<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Was anziehen?</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#2d6cdf;--bd:#dde1e7;--ok:#2e9d5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--tx:#eceff3;--mu:#9aa3ad;--ac:#6ea1ff;--bd:#323941;--ok:#5cc88a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:auto;padding:12px 12px 80px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px;color:var(--mu);display:block}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button.p{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;margin-top:8px}
button.s{padding:8px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx);font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:22px;font-weight:600}.mu{color:var(--mu);font-size:13px}.alt{padding:6px 0;border-top:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.row input{width:70px}
</style></head><body>
<h1>Was anziehen?</h1>
<nav id="nav"></nav><div id="v"></div>
<script>
const LS="wasAnziehen.v1";
const DEF=[
{id:"ts",name:"T-Shirt",layer:"base",w:1,wind:0,rain:0,own:1},
{id:"ls",name:"Langarmshirt",layer:"base",w:1.5,wind:0,rain:0,own:1},
{id:"pu",name:"Pulli",layer:"mid",w:2.5,wind:0,rain:0,own:1},
{id:"dj",name:"Dünne Jacke",layer:"outer",w:2,wind:1,rain:0,own:1},
{id:"wj",name:"Winterjacke",layer:"outer",w:4,wind:1,rain:0,own:1},
{id:"rj",name:"Regenjacke",layer:"outer",w:1.5,wind:1,rain:1,own:1},
{id:"us",name:"Regenschirm",layer:"acc",w:0,wind:0,rain:1,trig:"rain",own:1}];
let S={items:DEF,entries:[],wx:{t:12,f:12,wind:10,hum:70,rain:0}},tab="heute",sel=new Set(),fb="passt",ed=-1,dl=-1,note="";
try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);S.items=d.items||DEF;S.entries=d.entries||[];S.wx=d.wx||S.wx;S.acc1=d.acc1}}catch(e){}
S.wx.act??=1;if(!S.items.some(i=>i.layer==="acc")&&!S.acc1){S.items.push({id:"us",name:"Regenschirm",layer:"acc",w:0,wind:0,rain:1,trig:"rain",own:1})}S.acc1=1;S.wx.tod=(h=>h<11?0:h<17?1:2)(new Date().getHours());
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const own=()=>S.items.filter(i=>i.own);
const prior=(f,a)=>Math.max(0,1+(20-f)/3+[.7,0,-1.5][a??1]);
function predict(wx){
 const p=prior(wx.f,wx.act),E=S.entries;if(!E.length)return{need:p,n:0};
 const sc=[5,15,30,2,1,1.5],v=x=>[x.f,x.wind,x.hum,x.rain,x.act??1,x.tod??1];
 const ds=E.map(e=>{const a=v(e.wx),b=v(wx);return{d:Math.sqrt(a.reduce((s,x,i)=>s+((x-b[i])/sc[i])**2,0)),need:e.need}}).sort((a,b)=>a.d-b.d).slice(0,5);
 let ws=0,s=0;ds.forEach(x=>{const w=1/(x.d+.3);ws+=w;s+=w*x.need});
 const k=s/ws,n=E.length;return{need:(n*k+5*p)/(n+5),n};
}
function combos(wx,need){
 const it=own(),by=l=>it.filter(i=>i.layer===l),res=[];
 const bases=[null,...by("base")],mids=[null,...by("mid")],outs=[null,...by("outer")];
 for(const b of bases)for(const m of mids)for(const o of outs){
  if(!b&&!m&&!o)continue;if(m&&!b)continue;
  const parts=[b,m,o].filter(Boolean);let w=parts.reduce((s,x)=>s+x.w,0),pen=Math.abs(w-need);
  if(!b)pen+=2;
  if(wx.rain>0.3&&!(o&&o.rain))pen+=1.5;
  if(wx.wind>25&&!(o&&o.wind))pen+=.8;
  res.push({parts,w,pen});
 }
 return res.sort((a,b)=>a.pen-b.pen).slice(0,3);
}
const feels=wx=>wx.t-Math.max(0,wx.wind-5)*.12;
function accT(it){const c=it.trig==="cold",sg=c?-1:1,st=c?.5:.1,D=c?-5:.5,lo=c?-20:.1,hi=c?10:5,
L=S.entries.filter(e=>(e.accA||[]).includes(it.id)),x=e=>sg*(c?e.wx.f:e.wx.rain),
fin=t=>{t=Math.round(Math.min(hi,Math.max(lo,t))/st)*st;t=Math.round(t*10)/10;return{t:c?-t:t,n:L.length}};
if(L.length<3)return fin(D);
const ys=L.filter(e=>e.accT.includes(it.id)).map(x),ns=L.filter(e=>!e.accT.includes(it.id)).map(x);
let t;if(!ys.length)t=Math.max(D,Math.max(...ns)+st);else if(!ns.length)t=Math.min(D,Math.min(...ys));
else{const v=[...new Set(L.map(x))].sort((a,b)=>a-b),cs=[v[0]-st,...v.map((q,i)=>i<v.length-1?(q+v[i+1])/2:q+st)];let b=1e9;cs.forEach(q=>{const er=ns.filter(r=>r>=q).length+ys.filter(r=>r<q).length;if(er<b||(er===b&&Math.abs(q-D)<Math.abs(t-D))){b=er;t=q}})}
return fin(t)}
function acc(){const w=S.wx,L=[];own().filter(i=>i.layer==="acc").forEach(i=>{const T=accT(i).t,r=w.rain;if(i.trig==="rain"){if(r>=T)L.push(["☔ "+i.name,"Regen: "+r+" mm (deine Schwelle: "+T+" mm)"]);else if(r>0)L.push(["🌦 "+i.name+" (optional)","Leichter Regen: "+r+" mm, deine Schwelle: "+T+" mm"])}else if(w.f<=T)L.push(["🧣 "+i.name,"Gefühlt "+w.f+" °C (deine Schwelle: "+T+" °C)"])});return L.length?`<div class="card"><h2>Mitnehmen</h2>${L.map(x=>`<div class="alt"><b>${esc(x[0])}</b> <span class="mu">${esc(x[1])}</span></div>`).join("")}</div>`:""}
function nav(){$("#nav").innerHTML=[["heute","Heute"],["eintrag","Eintrag"],["schrank","Schrank"],["daten","Daten"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';ed=dl=-1;render()">${l}</button>`).join("")}
function wxForm(){const w=S.wx;return`<div class="g">
<div><label>Temperatur °C</label><input type="number" step="0.5" id="t" value="${w.t}"></div>
<div><label>Gefühlt °C</label><input type="number" step="0.5" id="f" value="${w.f}"></div>
<div><label>Wind km/h</label><input type="number" id="wi" value="${w.wind}"></div>
<div><label>Luftfeuchte %</label><input type="number" id="h" value="${w.hum}"></div>
<div><label>Regen mm</label><input type="number" step="0.1" id="r" value="${w.rain}"></div>
<div><label>Aktivität</label><select id="ac">${["Ruhig (Bus, Spaziergang)","Normal","Sportlich"].map((l,i)=>`<option value="${i}" ${(w.act??1)===i?"selected":""}>${l}</option>`).join("")}</select></div>
<div><label>Tageszeit</label><select id="td">${["Morgens","Tagsüber","Abends"].map((l,i)=>`<option value="${i}" ${(w.tod??1)===i?"selected":""}>${l}</option>`).join("")}</select></div></div>`}
function readWx(){const g=i=>parseFloat($(i).value)||0;S.wx={t:g("#t"),f:$("#f").value===""?g("#t"):g("#f"),wind:g("#wi"),hum:g("#h"),rain:g("#r"),act:+$("#ac").value,tod:+$("#td").value};save()}
async function loadWx(){
 note="Lade Wetter …";render();
 try{
  const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000}));
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,precipitation`;
  const c=(await (await fetch(u)).json()).current;
  S.wx={...S.wx,t:c.temperature_2m,f:c.apparent_temperature,wind:c.wind_speed_10m,hum:c.relative_humidity_2m,rain:c.precipitation};save();note="Aktuelles Wetter geladen.";
 }catch(e){note="Wetter konnte nicht automatisch geladen werden. Bitte Werte unten eintragen."}
 render();
}
function heute(){
 const p=predict(S.wx),c=combos(S.wx,p.need);
 return`<div class="card"><h2>Wetter</h2>${wxForm()}
 <button class="p" onclick="readWx();render()">Empfehlung berechnen</button>
 <button class="s" style="margin-top:8px;width:100%" onclick="loadWx()">Wetter automatisch laden</button>
 <div class="mu" style="margin-top:6px">${esc(note)}</div></div>
 ${acc()}<div class="card"><h2>Empfehlung</h2>
 ${c.length?c.map((x,i)=>i?`<div class="alt">${esc(x.parts.map(q=>q.name).join(" + "))} <span class="mu">(Wärme ${x.w})</span></div>`:`<div class="big">${esc(x.parts.map(q=>q.name).join(" + "))}</div><div class="mu">Wärme ${x.w} · Bedarf geschätzt ${p.need.toFixed(1)}</div>`).join(""):"Lege im Schrank Kleidung an."}
 <div class="mu" style="margin-top:8px">${p.n<5?`Basiert noch auf einer Faustformel. Mit ${5-p.n} weiteren Einträgen lernt die App deine Vorlieben.`:`Basiert auf deinen ${p.n} Einträgen.`}</div></div>`;
}
function eintrag(){
 return`<div class="card"><h2>Wetter beim Rausgehen</h2>${wxForm()}</div>
 <div class="card"><h2>Was hattest du an oder dabei?</h2><div class="chips">${own().map(i=>`<button class="chip ${sel.has(i.id)?"on":""}" onclick="tg('${i.id}')">${esc(i.name)}</button>`).join("")}</div></div>
 <div class="card"><h2>Wie war es?</h2><div class="chips">${[["kalt","Zu kalt"],["passt","Passt"],["warm","Zu warm"]].map(([k,l])=>`<button class="chip ${fb===k?"on":""}" onclick="readWx();fb='${k}';render()">${l}</button>`).join("")}</div>
 <button class="p" onclick="add()">Eintrag speichern</button><div class="mu" style="margin-top:6px">${esc(note)}</div></div>`;
}
function tg(id){readWx();sel.has(id)?sel.delete(id):sel.add(id);render()}
function add(){
 readWx();const w=S.items.filter(i=>sel.has(i.id));
 const cl=w.filter(i=>i.layer!=="acc");if(!cl.length){note="Bitte mindestens ein Kleidungsstück wählen.";render();return}
 const tot=cl.reduce((s,x)=>s+x.w,0),need=Math.max(0,tot+(fb==="kalt"?1.5:fb==="warm"?-1.5:0));
 S.entries.push({date:new Date().toISOString().slice(0,10),wx:{...S.wx},worn:cl.map(x=>x.name),total:tot,fb,need,accT:w.filter(i=>i.layer==="acc").map(i=>i.id),accA:own().filter(i=>i.layer==="acc").map(i=>i.id)});
 save();sel=new Set();fb="passt";note="Gespeichert.";render();
}
function schrank(){
 return`<div class="card"><h2>Mein Kleiderschrank</h2><div class="mu">Haken = besitze ich. Wärmewert anpassbar.</div>
 ${S.items.map((i,k)=>`<div class="row"><label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:16px;flex:1"><input type="checkbox" style="width:auto" ${i.own?"checked":""} onchange="S.items[${k}].own=this.checked?1:0;save()">${ed===k?`<input id="en" value="${esc(i.name)}" style="width:100%;min-width:100px">`:esc(i.name)}</label>${i.layer==="acc"?"":`<input type="number" step="0.5" value="${i.w}" onchange="S.items[${k}].w=parseFloat(this.value)||0;save()">`}<span style="display:flex;gap:4px">${ed===k?`<button class="s" onclick="saveRen(${k})">✓</button>`:`<button class="s" onclick="ed=${k};dl=-1;render()">✎</button>`}${dl===k?`<button class="s" style="color:#d33" onclick="delItem(${k})">Löschen?</button>`:`<button class="s" onclick="dl=${k};ed=-1;render()">✕</button>`}</span></div>`).join("")}</div>
 <div class="card"><h2>Teil hinzufügen</h2><div class="g"><div><label>Name</label><input id="nn"></div>
 <div><label>Schicht</label><select id="nl" onchange="fm()"><option value="base">Unterschicht</option><option value="mid">Mittelschicht</option><option value="outer">Jacke</option><option value="acc">Zubehör (z. B. Schirm)</option></select></div>
 <div id="fw"><label>Wärme</label><input id="nw" type="number" step="0.5" value="2"></div>
 <div id="fs"><label>Schutz</label><select id="np"><option value="0">keiner</option><option value="1">Wind</option><option value="2">Wind + Regen</option></select></div>
 <div id="ft" style="display:none"><label>Zubehör zeigen bei</label><select id="nt"><option value="rain">Regen</option><option value="cold">Kälte (unter 5 °C)</option></select></div></div>
 <button class="p" onclick="addItem()">Hinzufügen</button></div>`;
}
function addItem(){const n=$("#nn").value.trim();if(!n)return;const p=+$("#np").value;
 S.items.push({id:"c"+Date.now(),name:n,layer:$("#nl").value,w:$("#nl").value==="acc"?0:(parseFloat($("#nw").value)||0),wind:p>=1?1:0,rain:p===2?1:0,trig:$("#nt").value,own:1});save();render()}
function saveRen(k){const n=$("#en").value.trim();if(n)S.items[k].name=n;ed=-1;save();render()}
function fm(){const a=$("#nl").value==="acc";$("#fw").style.display=a?"none":"";$("#fs").style.display=a?"none":"";$("#ft").style.display=a?"":"none"}
function delItem(k){S.items.splice(k,1);dl=-1;save();render()}
function daten(){
 return`${own().some(i=>i.layer==="acc")?`<div class="card"><h2>Zubehör-Schwellen</h2>${own().filter(i=>i.layer==="acc").map(i=>{const a=accT(i);return`<div class="row"><div>${esc(i.name)}<div class="mu">${a.n<3?"Noch Standardwert":"Gelernt aus "+a.n+" Einträgen"}</div></div><b>${i.trig==="cold"?"bis "+a.t+" °C":"ab "+a.t+" mm"}</b></div>`}).join("")}</div>`:""}<div class="card"><h2>Einträge (${S.entries.length})</h2>
 ${S.entries.slice().reverse().map((e,i)=>`<div class="row"><div>${esc(e.date)} · ${esc(e.worn.join(" + "))}<div class="mu">${e.wx.f}°C gefühlt, ${e.wx.wind} km/h · ${["ruhig","normal","sportlich"][e.wx.act??1]} · ${["morgens","tagsüber","abends"][e.wx.tod??1]} · ${e.fb==="kalt"?"zu kalt":e.fb==="warm"?"zu warm":"passt"}</div></div><button class="s" onclick="S.entries.splice(${S.entries.length-1-i},1);save();render()">✕</button></div>`).join("")||'<div class="mu">Noch keine Einträge.</div>'}</div>
 <div class="card"><h2>Sichern</h2><div class="mu">Daten liegen nur auf diesem Gerät. Zum Umziehen exportieren.</div>
 <button class="p" onclick="exp()">Exportieren</button>
 <input type="file" accept=".json" style="margin-top:8px" onchange="imp(this.files[0])"></div>
 <div class="mu" style="text-align:center;font-size:11px;margin-top:6px">Diese App wird präsentiert von Anian<br>Wetterdaten: Open-Meteo.com</div>`;
}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="was-anziehen.json";a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);S.items=d.items||S.items;S.entries=d.entries||[];save();note="Importiert.";render()}catch(e){note="Datei ungültig."}})}
function render(){nav();$("#v").innerHTML={heute,eintrag,schrank,daten}[tab]()}
render();loadWx();
</script></body></html>
